services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop_payments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    configs:
      - source: create_test_db
        target: /docker-entrypoint-initdb.d/create_test_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U shop -d shop_payments"]
      interval: 5s
      timeout: 3s
      retries: 10

configs:
  create_test_db:
    content: CREATE DATABASE shop_payments_test;

volumes:
  pgdata:
